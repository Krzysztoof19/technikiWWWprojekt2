<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - Akademia Tenisa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="kontener-nawigacji">
            <div class="logo">Akademia Tenisa Stołowego</div>
            <ul class="menu">
                <li><a href="index.html">Strona Główna</a></li>
                <li><a href="rejestracja.html">Zarejestruj się</a></li>
            </ul>
        </div>
    </nav>

    <div class="kontener-formularza" style="margin-top: 50px; background: white; padding: 30px; border-radius: 8px;">
        <h2 style="text-align: center;">Zaloguj się</h2>
        
        <p id="loginMessage" style="text-align: center; font-weight: bold;"></p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" name="email" id="loginEmail" required>
            
            <label>Hasło</label>
            <input type="password" name="haslo" id="loginHaslo" required>
            
            <button type="submit" class="przycisk-pelny">WEJDŹ</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">Nie masz konta? <a href="rejestracja.html" style="color: #CC0000;">Zarejestruj się tutaj</a></p>
    </div>
<script src="script.js"></script>    
</body>
</html>
